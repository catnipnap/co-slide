name: Release & Publish Extension

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  release:
    name: Build, Release & Publish
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: write # GitHub Release 및 VSIX 파일 첨부 권한

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Compile Extension
        run: npm run compile

      - name: Package VSIX
        run: npx @vscode/vsce package --no-git-tag-version

      - name: Create GitHub Release and Upload VSIX
        uses: softprops/action-gh-release@v2
        with:
          files: '*.vsix'
          name: Release ${{ github.ref_name }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to Open VSX Registry (OIDC Tokenless)
        continue-on-error: true
        run: npx ovsx publish --no-git-tag-version
