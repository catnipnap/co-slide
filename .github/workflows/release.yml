name: Publish Extension to Open VSX

on:
  release:
    types: [published]
  push:
    tags:
      - 'v*'
  workflow_dispatch: # GitHub Actions 웹 페이지에서 수동으로 'Run workflow' 버튼 클릭하여 배포 가능

jobs:
  publish:
    name: Publish to Open VSX
    runs-on: ubuntu-latest

    # Open VSX Trusted Publishing 필수 OIDC 권한
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Compile Extension
        run: npm run compile

      - name: Package VSIX
        run: npx @vscode/vsce package --no-git-tag-version

      - name: Publish to Open VSX Registry (OIDC Tokenless)
        run: npx ovsx publish --no-git-tag-version
